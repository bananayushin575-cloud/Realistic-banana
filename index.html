<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realistic Banana 3D</title>
    <meta
      name="description"
      content="Three.jsによるプロシージャル3Dキャベンディッシュ・バナナ標本ビューア。熟度変化とリアルな皮むきアニメーションを操作できます。"
    />
    <meta property="og:title" content="Realistic Banana 3D" />
    <meta
      property="og:description"
      content="Three.jsによるプロシージャル3Dキャベンディッシュ・バナナ標本ビューア。熟度変化とリアルな皮むきアニメーションを操作できます。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <main id="app" class="studio-app">
      <div id="canvas-root" class="canvas-root" aria-label="3Dバナナビューポート"></div>

      <header class="studio-header">
        <h1 class="studio-title">キャベンディッシュ バナナ 3D</h1>
        <p class="studio-meta">
          <span>Musa acuminata</span>
          <span aria-hidden="true">·</span>
          <span id="stage-label">食べ頃イエロー</span>
          <span aria-hidden="true">·</span>
          <span>ドラッグで回転 / スクロールで拡大</span>
        </p>
      </header>

      <div id="webgl-fallback" class="webgl-fallback" hidden>
        <p>このブラウザ環境では WebGL 3D 表示を利用できません。</p>
      </div>

      <section id="dock-shell" class="dock-shell" aria-label="3Dモデル操作パネル">
        <button
          id="dock-toggle-btn"
          type="button"
          class="dock-toggle-btn"
          aria-expanded="true"
          aria-controls="control-dock"
        >
          コントロールを隠す (H)
        </button>

        <div id="control-dock" class="control-dock">
          <div class="sliders-row">
            <label class="slider-control" for="ripeness-slider">
              <span class="slider-head">
                <span class="slider-title">熟度</span>
                <span id="ripeness-value" class="slider-value">55%</span>
              </span>
              <input
                id="ripeness-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="55"
              />
            </label>

            <label class="slider-control" for="peel-slider">
              <span class="slider-head">
                <span class="slider-title">皮の剥け具合</span>
                <span id="peel-value" class="slider-value">0%</span>
              </span>
              <input
                id="peel-slider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="0"
              />
            </label>
          </div>

          <div class="actions-row">
            <button id="peel-anim-btn" type="button" class="btn-primary">
              皮を剥く
            </button>

            <div class="segmented-group" role="group" aria-label="カメラ視点">
              <button
                type="button"
                class="seg-btn is-active"
                data-camera-preset="overview"
                aria-pressed="true"
              >
                全体
              </button>
              <button
                type="button"
                class="seg-btn"
                data-camera-preset="closeup"
                aria-pressed="false"
              >
                拡大
              </button>
              <button
                type="button"
                class="seg-btn"
                data-camera-preset="top"
                aria-pressed="false"
              >
                上から
              </button>
            </div>

            <div class="utility-group">
              <button id="spin-btn" type="button" class="btn-ghost" aria-pressed="false">
                自動回転: OFF
              </button>
              <button id="pedestal-btn" type="button" class="btn-ghost is-active" aria-pressed="true">
                台座: ON
              </button>
              <button id="reset-btn" type="button" class="btn-ghost">
                リセット
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
